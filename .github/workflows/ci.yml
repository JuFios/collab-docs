name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  # The published page is only worth having if it stays an ISR page without the editor in its bundle.
  web-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:libs
      - run: pnpm --filter @collab-docs/web build
      - run: pnpm --filter @collab-docs/web check:bundle

  unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: collab
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: collab
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U collab -d collab"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8.8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.32.0
        ports: ['1025:1025', '8025:8025']
    env:
      DATABASE_URL: postgresql://collab:ci-postgres-password@localhost:5432/collab
      REDIS_URL: redis://localhost:6379
      MAILPIT_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Migrations apply and match schema.prisma
        run: |
          pnpm --filter @collab-docs/db db:deploy
          pnpm --filter @collab-docs/db db:drift
      # The upload tests talk to a real MinIO. Its image is built from source, so reuse the layer cache that
      # the docker-build job writes under the same scope.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/bake-action@v6
        with:
          files: docker-compose.yml
          targets: minio
          load: true
          set: |
            minio.cache-from=type=gha,scope=minio
      - name: Start MinIO
        run: |
          docker compose up --no-build --wait -d minio
          docker compose run --rm --no-deps minio-init
      - run: pnpm test:integration
      - name: OpenAPI document is up to date
        run: |
          pnpm --filter @collab-docs/api openapi:export
          git diff --exit-code docs/openapi.json

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            context: .
            file: apps/web/Dockerfile
          - name: api
            context: .
            file: apps/api/Dockerfile
          - name: collab
            context: .
            file: apps/collab/Dockerfile
          - name: migrate
            context: .
            file: packages/db/Dockerfile
          - name: minio
            context: docker/minio
            file: docker/minio/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  e2e:
    runs-on: ubuntu-latest
    needs: [lint-typecheck]
    timeout-minutes: 30
    env:
      # every test user registers from the runner's address
      RATE_REGISTER_PER_HOUR_IP: '10000'
      RATE_LOGIN_PER_MIN_IP: '10000'
      RATE_LOGIN_PER_MIN_IP_EMAIL: '10000'
      # lets the streaming spec observe skeletons before data (read by the web container and by the spec)
      DASHBOARD_BLOCK_DELAY_MS: '600'
      # bake tags images with the names compose expects for this project
      COMPOSE_PROJECT_NAME: collab-docs
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # System libraries are intentionally not installed: the runner image already carries what headless
      # Chromium needs, and `install-deps` spent ~10 minutes in apt on every run.
      - name: Install browser
        run: pnpm exec playwright install chromium
        if: steps.browsers.outputs.cache-hit != 'true'
      - uses: docker/setup-buildx-action@v3
      # Reuse the layer caches the docker-build job writes (same scopes), instead of rebuilding from scratch
      - uses: docker/bake-action@v6
        with:
          files: docker-compose.yml
          targets: web,api,collab,migrate,minio
          load: true
          set: |
            web.tags=collab-docs-web
            collab.tags=collab-docs-collab
            migrate.tags=collab-docs-migrate
            web.cache-from=type=gha,scope=web
            api.cache-from=type=gha,scope=api
            collab.cache-from=type=gha,scope=collab
            migrate.cache-from=type=gha,scope=migrate
            minio.cache-from=type=gha,scope=minio
      - name: Start the stack
        run: docker compose up --no-build --wait proxy worker
      - run: pnpm test:e2e
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color --tail=200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
