# Public entry point. It exists so that the client address the api rate-limits on is one we set ourselves:
# nginx replaces X-Forwarded-For with the peer address and never forwards a value supplied by the client.

# Docker's embedded DNS. `web` is resolved per request (see $web below) instead of once at startup, so a
# recreated web container is picked up without restarting nginx.
resolver 127.0.0.11 valid=5s ipv6=off;

# Invite and edit-link URLs carry their secret in the path: the access log masks it, logs no query string (a
# `next` parameter can hold such a path) and no Referer (which can be one of those URLs).
map $uri $loggable_uri {
    "~^(?<secret_prefix>/(?:invite|edit-link|api/invites|api/public/links)/)[^/]+(?<secret_rest>.*)$" "${secret_prefix}[REDACTED]${secret_rest}";
    default $uri;
}
log_format redacted '$remote_addr [$time_local] "$request_method $loggable_uri $server_protocol" '
                    '$status $body_bytes_sent $request_time "$http_user_agent"';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log redacted;

    # Server Actions post form bodies; uploads go straight to object storage via presigned POST
    client_max_body_size 2m;

    # Handlers that only the api worker may call (it reaches web directly, not through this proxy)
    location /internal/ {
        return 404;
    }

    location / {
        # a variable makes nginx resolve the name at request time; without a URI part the request URI is passed as is
        set $web http://web:3000;
        proxy_pass $web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # overwrite, not append ($proxy_add_x_forwarded_for would keep what the client sent)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;

        # SSE (/api/events/stream) sends heartbeats every 25 s and asks nginx not to buffer
        # (X-Accel-Buffering: no); the read timeout only has to outlive one heartbeat interval
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }
}
